[package]
name = "krabiecdsa"
version = "0.5.0"
edition = "2024"
rust-version = "1.87"
description = "ECDSA signature verification and signing for P-256, secp256k1, and P-384 — no_std, no-alloc, generic over the bigint backend via modmath"
license = "Apache-2.0"
readme = "../README.md"
repository = "https://github.com/kaidokert/krabiecdsa-rs"
keywords = ["ecdsa", "p256", "secp256k1", "no_std", "embedded"]
categories = ["cryptography", "no-std", "no-std::no-alloc", "embedded"]

[dependencies]
modmath = "0.6.1"
const-num-traits = { version = "0.2.1", default-features = false, features = ["ct"] }
signature = { version = "3.0", default-features = false, features = ["rand_core", "digest"] }
zeroize = { version = "1", default-features = false }
digest = { version = "0.11", default-features = false, features = ["mac"] }
subtle = { version = "2.6", default-features = false }
kem = { version = "0.3", default-features = false, optional = true }

[features]
default = ["ecdh"]
# ECDH key agreement via the RustCrypto `kem` traits. Pulls `kem` +
# `hybrid-array`; on by default but opt-out (`default-features = false`) for
# verify/sign-only builds that don't want the dependency — notably the
# hardware timing benchmark, whose M4 cycle spread is layout-sensitive.
ecdh = ["dep:kem"]
# Exposes the hazmat known-answer-test primitives — sign-with-caller-nonce
# (`sign_prehashed_ct_with_k`) and raw nonce derivation
# (`derive_nonce_rfc6979_ct`). Neither is a production operation (an explicit
# or exposed nonce is a key-leak footgun), so they stay out of the default
# API; they exist only to reproduce RFC/CAVP vectors and are enabled by the
# integration tests and the ct-verify harness. Signing itself is always
# available — no feature needed.
test-vectors = []

[dev-dependencies]
fixed-bigint = { version = "0.6.0", default-features = false, features = ["cios", "zeroize"] }
# Heap-backed non-Copy carrier (Nct) for the verify-only non-Copy path
# test; pinned to modmath's tag so it unifies to one `FixedWidthBigUint`.
num-bigint = { git = "https://github.com/kaidokert/num-bigint.git", tag = "v0.4.4-const-12" }
signature = { version = "3.0", default-features = false }
sha2 = "0.11"
hmac = "0.13"
digest = { version = "0.11", features = ["mac"] }
wycheproof = { version = "0.6", default-features = false, features = ["ecdsa"] }
