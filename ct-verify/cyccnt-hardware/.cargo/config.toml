[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
# No committed probe serial — auto-detect covers a single-probe dev desk. On a
# multi-probe host (e.g. the bench) `cargo run` errors "multiple probes"; select
# one via the env override rather than baking a serial in:
#   CARGO_TARGET_THUMBV7EM_NONE_EABIHF_RUNNER="probe-rs run --chip STM32F407VGTx --protocol swd --connect-under-reset --probe $KRABI_PROBE"
# (The CI campaign drives its own probe binding through krabi-caliper.toml.)
# --connect-under-reset matches the campaign profile: a clean core state per
# attach avoids stale-breakpoint attach failures.
runner = "probe-rs run --chip STM32F407VGTx --protocol swd --connect-under-reset"
