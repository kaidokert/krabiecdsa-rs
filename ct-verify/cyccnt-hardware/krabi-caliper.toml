# Two clock tiers. The CT verdict is taken at 30 MHz / 0 wait states (below),
# where determinism makes a small sample count valid; the slow byte-limb carrier
# runs at 168 MHz as functional smoke (its sign would time out at 30 MHz). The
# instruction-level CT proof for every carrier lives in the ctgrind + asm-ladder
# gates; this hardware layer is timing-regression evidence on top.

# ── 168 MHz: functional smoke for the slow carrier ───────────────────
[profiles.jtrace-f407-168mhz]
runner = "command"
target = "thumbv7em-none-eabihf"
build-features = ["clock-168mhz"]
board = "jtrace-reference-board"
mcu = "STM32F407VG"
transport = "rtt"
probe = "${KRABI_PROBE}"
clock-frequency-hz = 168000000
executable = "probe-rs"
args = [
  "run",
  "--chip", "STM32F407VGTx",
  "--protocol", "swd",
  "--probe", "${KRABI_PROBE}",
  # Attach with the target held in reset so each chunk starts from a clean core
  # state; attaching to still-running firmware can fail to clear breakpoints.
  "--connect-under-reset",
  "--non-interactive",
  "--disable-progressbars",
  "--no-location",
  "{artifact}",
]
completion-marker = "EM_SUMMARY"
completion-action = "interrupt"
timeout-seconds = 900
target-dir = "target"
artifact-extension = ""

# ── 30 MHz, 0 wait states: the deterministic CT gate ─────────────────
# 0 WS => no ART prefetch/I-cache, so core-cycle counts carry no fetch jitter
# and the tight 32-cycle spread gate holds. u32x8 is the representative carrier.
[profiles.jtrace-f407-30mhz-0ws]
runner = "command"
target = "thumbv7em-none-eabihf"
build-features = ["clock-30mhz"]
board = "jtrace-reference-board"
mcu = "STM32F407VG"
transport = "rtt"
probe = "${KRABI_PROBE}"
clock-frequency-hz = 30000000
executable = "probe-rs"
args = [
  "run",
  "--chip", "STM32F407VGTx",
  "--protocol", "swd",
  "--probe", "${KRABI_PROBE}",
  "--connect-under-reset",
  "--non-interactive",
  "--disable-progressbars",
  "--no-location",
  "{artifact}",
]
completion-marker = "EM_SUMMARY"
completion-action = "interrupt"
timeout-seconds = 600
target-dir = "target"
artifact-extension = ""

# ── CT gate: u32x8 at 30 MHz, all four fixtures, tight spread ────────
[[case-sets.krabiecdsa-ct-30mhz]]
name = "u32x8"
binary = "krabiecdsa-cyccnt-hardware"
features = ["carrier-u32x8"]
expected-suite = "krabiecdsa-p256-sign"

[campaigns.krabiecdsa-ct-jtrace-f407-30mhz]
profile = "jtrace-f407-30mhz-0ws"
case-set = "krabiecdsa-ct-30mhz"
matrix = { fixture = ["nonce", "fixedsign", "wholesign", "keygen", "montmul", "kinv"] }
matrix-features = ["fix-{fixture}"]
# gate = true: the baseline bench run confirmed all four u32x8 positives hold
# (BelowThreshold across keys) and negative_early_exit separates
# (DeterministicDifference), so this 30 MHz / 0-WS tier now fails CI on a
# protected-class timing regression (matching the ed25519/RSA 30 MHz gates).
constant-time = { welch-threshold = 4.5, minimum-samples-per-class = 4, protected-classes = ["positive", "positive-whole-operation"], control-classes = ["negative"], gate = true }

# ── Smoke: u8x32 (byte-limb) at 168 MHz, functional + rough timing ───
# The byte-limb sign is ~10x u32x8; at 30 MHz it times out. 168 MHz keeps wall
# time bounded. Not a CT gate (gate = false) — the CT property for u8x32 is
# proven at the instruction level by ctgrind; this confirms it signs on hardware
# and captures rough timing.
[[case-sets.krabiecdsa-smoke-168mhz]]
name = "u8x32"
binary = "krabiecdsa-cyccnt-hardware"
features = ["carrier-u8x32"]
expected-suite = "krabiecdsa-p256-sign"

[campaigns.krabiecdsa-smoke-jtrace-f407-168mhz]
profile = "jtrace-f407-168mhz"
case-set = "krabiecdsa-smoke-168mhz"
matrix = { fixture = ["nonce", "fixedsign", "wholesign", "keygen"] }
matrix-features = ["fix-{fixture}"]
constant-time = { welch-threshold = 4.5, minimum-samples-per-class = 4, protected-classes = ["positive", "positive-whole-operation"], control-classes = ["negative"], gate = false }
