[profiles.jtrace-f407]
runner = "command"
target = "thumbv7em-none-eabihf"
board = "jtrace-reference-board"
mcu = "STM32F407VG"
transport = "rtt"
probe = "${KRABI_PROBE}"
clock-frequency-hz = 30000000
executable = "probe-rs"
args = [
  "run",
  "--chip", "STM32F407VGTx",
  "--protocol", "swd",
  "--probe", "${KRABI_PROBE}",
  # Attach with the target held in reset so each attach starts from a clean core
  # state; attaching to still-running firmware can fail to clear breakpoints.
  "--connect-under-reset",
  "--non-interactive",
  "--disable-progressbars",
  "--no-location",
  "{artifact}",
]
completion-marker = "EM_SUMMARY"
completion-action = "interrupt"
# Whole ECDSA signs are ~120M cycles each; at 30 MHz the full single-session
# suite runs longer than the fast-bignum template's 120 s.
timeout-seconds = 300
target-dir = "target"
artifact-extension = ""

# One case per carrier; each chunk is one fixture, so all inherit the profile's
# 300 s limit.
[[case-sets.krabiecdsa-signing-cyccnt]]
name = "u32x8"
binary = "krabiecdsa-cyccnt-hardware"
features = ["carrier-u32x8"]
expected-suite = "krabiecdsa-p256-sign"

[[case-sets.krabiecdsa-signing-cyccnt]]
name = "u8x32"
binary = "krabiecdsa-cyccnt-hardware"
features = ["carrier-u8x32"]
expected-suite = "krabiecdsa-p256-sign"

[[case-sets.krabiecdsa-signing-cyccnt]]
name = "u64x4"
binary = "krabiecdsa-cyccnt-hardware"
features = ["carrier-u64x4"]
expected-suite = "krabiecdsa-p256-sign"

[campaigns.krabiecdsa-jtrace-f407]
profile = "jtrace-f407"
case-set = "krabiecdsa-signing-cyccnt"
# Expand the three carrier cases across the fixture axis so each
# (carrier, fixture) pair — 12 in all — measures in its own probe-rs session.
# A fresh session per fixture keeps cross-fixture probe/bus state from
# perturbing a later fixture's first timed samples; each pair is independently
# gated with its own negative control.
matrix = { fixture = ["nonce", "fixedsign", "wholesign", "keygen"] }
matrix-features = ["fix-{fixture}"]
# gate = false for the first bench baseline; flip to true (matching ed25519)
# once the post-CT-derivation run confirms all positives hold and the control
# separates.
constant-time = { welch-threshold = 4.5, minimum-samples-per-class = 4, protected-classes = ["positive", "positive-whole-operation"], control-classes = ["negative"], gate = false }
