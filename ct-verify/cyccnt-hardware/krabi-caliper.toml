[profiles.jtrace-f407]
runner = "command"
target = "thumbv7em-none-eabihf"
board = "jtrace-reference-board"
mcu = "STM32F407VG"
transport = "rtt"
probe = "${KRABI_PROBE}"
clock-frequency-hz = 16000000
executable = "probe-rs"
args = [
  "run",
  "--chip", "STM32F407VGTx",
  "--protocol", "swd",
  "--probe", "${KRABI_PROBE}",
  "--non-interactive",
  "--disable-progressbars",
  "--no-location",
  "{artifact}",
]
completion-marker = "EM_SUMMARY"
completion-action = "interrupt"
timeout-seconds = 120
target-dir = "target"
artifact-extension = ""

[[case-sets.krabiecdsa-signing-cyccnt]]
name = "p256-layered-signing"
binary = "krabiecdsa-cyccnt-hardware"
expected-suite = "krabiecdsa-p256-sign"

[campaigns.krabiecdsa-jtrace-f407]
profile = "jtrace-f407"
case-set = "krabiecdsa-signing-cyccnt"
constant-time = { welch-threshold = 4.5, minimum-samples-per-class = 4, protected-classes = ["positive", "positive-whole-operation"], control-classes = ["negative"], gate = false }
