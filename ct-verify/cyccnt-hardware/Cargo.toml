[package]
name = "krabiecdsa-cyccnt-hardware"
version = "0.1.0"
edition = "2024"
# 1.88 (above the crate's 1.87) — stm32f4xx-hal 0.23 pulls time ≥ 0.3.54,
# whose MSRV is 1.88. This embedded campaign isn't part of the host
# harness's 1.87-pinned codegen lock.
rust-version = "1.88"
publish = false

[features]
default = ["clock-168mhz"]
clock-168mhz = ["dep:stm32f4xx-hal"]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
krabi-caliper = { version = "0.1.2", features = ["cortex-m-dwt", "paired", "rtt", "stack"] }
fixed-bigint = { version = "0.6.0", default-features = false, features = ["zeroize", "use-unsafe", "cios"] }
hmac = { version = "0.12", default-features = false }
krabiecdsa = { path = "../../ecdsa", features = ["experimental-signing"] }
sha2 = { version = "0.10", default-features = false }
stm32f4xx-hal = { version = "0.23", default-features = false, features = ["stm32f407"], optional = true }
